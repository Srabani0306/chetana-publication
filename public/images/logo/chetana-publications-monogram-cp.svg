<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0E2240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C670"/>
      <stop offset="100%" stop-color="#B5872F"/>
    </linearGradient>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- background disc -->
  <circle cx="250" cy="250" r="230" fill="url(#navyGrad)"/>

  <!-- thin gold ring, inset -->
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- monogram: C (gold, open) wrapping a P (cream, solid) -->
  <g transform="translate(250,262)">
    <!-- C stroke, drawn as an arc so it reads as a clean letterform -->
    <path d="M 60,-92
             A 95,95 0 1 0 60,92"
          fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- P, solid serif, nested inside the C's opening -->
    <text x="-8" y="34" text-anchor="middle" class="serif"
          font-size="168" font-weight="700" fill="#F4EDE0">P</text>
  </g>

  <!-- fine hairline accents top & bottom, echoing a book's edge -->
  <line x1="180" y1="118" x2="320" y2="118" stroke="#F4EDE0" stroke-width="1.5" opacity="0.55"/>
  <line x1="180" y1="382" x2="320" y2="382" stroke="#F4EDE0" stroke-width="1.5" opacity="0.55"/>
</svg>
